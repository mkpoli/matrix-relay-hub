# Copy to the QQ data directory as config.toml and edit.
# The file holds bridge and QQ credentials; keep it mode 600.

[matrix]
homeserver = "http://your-homeserver:8008"
domain = "example.org"
as_token = "CHANGE"
hs_token = "CHANGE"
bot_mxid = "@qqbot:example.org"
listen_host = "0.0.0.0"
listen_port = 29335

[qq]
app_id = "CHANGE"
app_secret = "CHANGE"

# One entry per Matrix room. `group` is optional: leave it out and send
# `!qq bind <code>` in the QQ group instead.
[[bridge]]
room = "#qq-test:example.org"
code = "test"

[[bridge]]
room = "#welcome:example.org"
code = "welcome"
