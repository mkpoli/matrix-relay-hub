# Copy to the QQ data directory as config.toml and edit.
# The file holds bridge and QQ credentials; keep it mode 600.

[matrix]
homeserver = "http://your-homeserver:8008"
domain = "example.org"
as_token = "CHANGE"
hs_token = "CHANGE"
bot_mxid = "@qqbot:example.org"
listen_host = "0.0.0.0"
listen_port = 29335

[qq]
app_id = "CHANGE"
app_secret = "CHANGE"
group = "GROUP_OPENID"
incoming = "#qq-test:example.org"

# Each room is mirrored into the group. The incoming room receives QQ
# messages; labels prefix messages when more than one room is listed.
[[room]]
alias = "#qq-test:example.org"
label = "test"

[[room]]
alias = "#welcome:example.org"
label = "welcome"
