[project]
name = "wecom-bridge"
version = "0.1.0"
description = "Matrix bridge for WeCom (Enterprise WeChat) AI bots and group webhooks"
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.10", "cryptography>=43", "pillow>=11"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
